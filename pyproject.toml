[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msagent"
version = "0.1.0"
description = "Governed multi-tenant member-services agent: tool gateway, tenant isolation, PHI minimisation, confirmed idempotent writes."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.0",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.8",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
msagent = "msagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs the supplied pack (mock server + kb); skipped when MSA_PACK_DIR has no pack"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "S105", "S106"]
